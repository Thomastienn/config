# ================================================================
# TMUX CONFIGURATION - MODERN AESTHETIC DESIGN
# ================================================================

# ----------------------------------------------------------------
# TERMINAL & COLOR SETTINGS
# ----------------------------------------------------------------
# Better terminal support with true color
set-option -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g focus-events on

# Enable system clipboard integration
set-option -g set-clipboard on
set-option -ga terminal-overrides ",xterm*:Tc"
set-option -g allow-passthrough on

# Copy bindings using xclip
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Remove delay when switching between Vim modes
set -sg escape-time 0

# ----------------------------------------------------------------
# GENERAL SETTINGS
# ----------------------------------------------------------------
# Use vim keybindings
set-window-option -g mode-keys vi

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Increase tmux messages display duration
set -g display-time 4000

# Refresh status line every 5 seconds
set -g status-interval 5

# ----------------------------------------------------------------
# KEY BINDINGS
# ----------------------------------------------------------------
# Make new panes inherit pwd path
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Better pane navigation (vim-like)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Move current window left/right and follow it
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Resize panes with arrow keys
bind -r Left resize-pane -L 5
bind -r Down resize-pane -D 5
bind -r Up resize-pane -U 5
bind -r Right resize-pane -R 5

# Quick reload of config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ----------------------------------------------------------------
# VISUAL DESIGN - COZY MINT
# ----------------------------------------------------------------

# Cozy Mint colors, coordinated with theme.sh
color_bg="default"             # Background (dark)
color_fg="#EEE8DC"            # Foreground (light)

# Base colors - grayscale for text
color_base03="black"           # Darkest - background
color_base02="#272C27"       # Dark gray - background highlights
color_base01="#ABAFA4"       # Medium gray - comments
color_base00="colour244"       # Light gray - secondary text
color_base0="colour247"        # Lighter gray - body text
color_base1="#EEE8DC"        # Very light gray - emphasized
color_base2="colour254"        # Almost white
color_base3="white"            # White - brightest text

# Accent colors
color_primary="#A7CCAE"       # Mint
color_bright="#C0AFD5"       # Lavender
color_light="#ABAFA4"        # Muted text
color_medium="#272C27"       # Sage surface
color_forest="#ABAFA4"       # Muted text
color_brown="#DEC28A"        # Amber
color_sage="#5D6D5E"         # Sage, inactive window numbers
color_border="#2E352F"       # Inactive pane borders

# ----------------------------------------------------------------
# STATUS BAR DESIGN - MINT AND LAVENDER ACCENTS
# ----------------------------------------------------------------
# Status bar general settings
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "bg=$color_bg,fg=$color_fg"
set -g status-left-length 100
set -g status-right-length 100

# Left status: session pill (lavender while prefix is held), then the ssh target when a pane is ssh'd
set -g status-left "#{?client_prefix,#[fg=$color_bright],#[fg=$color_primary]}#[bg=$color_bg]#{?client_prefix,#[bg=$color_bright],#[bg=$color_primary]}#[fg=$color_base03,bold] #S #[bg=$color_bg]#{?client_prefix,#[fg=$color_bright],#[fg=$color_primary]}#[fg=$color_light,nobold] #(ps -t #{pane_tty} -o command= 2>/dev/null | awk '/^ssh / {print \"⇄\", \$2; exit}')"

# System status lives in Polybar and Conky; Git state lives in the shell prompt.
set -g status-right ""

# Active window as a mint pill, others muted
setw -g window-status-current-format "#[fg=$color_primary,bg=$color_bg]#[bg=$color_primary,fg=$color_base03,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=$color_primary,bg=$color_bg,nobold]"
setw -g window-status-format "#[fg=$color_sage] #I #[fg=$color_light]#W#{?window_zoomed_flag, 󰊓,} "

# Window names: folder for a shell, program otherwise (node's script name, so codex reads "codex")
set -g automatic-rename on
set -g automatic-rename-format '#{=/15/…:#{?#{==:#{pane_current_command},bash},#{b:pane_current_path},#{?#{==:#{pane_current_command},node},#(ps -o args= --ppid #{pane_pid} | head -1 | cut -d" " -f2 | xargs basename),#{pane_current_command}}}}'

# Window status separator
setw -g window-status-separator " "

# Activity and bell styling
setw -g window-status-activity-style "fg=$color_bright,bold"
setw -g window-status-bell-style "fg=$color_bright,bold"

# ----------------------------------------------------------------
# PANE BORDERS - MINIMALIST STYLE
# ----------------------------------------------------------------
# Pane border colors
set -g pane-border-style "fg=$color_border"
set -g pane-active-border-style "fg=$color_primary"

# No pane border status (border is part of status bar now)
set -g pane-border-status off

# ----------------------------------------------------------------
# MESSAGE STYLING
# ----------------------------------------------------------------
# Command line/message text
set -g message-style "bg=$color_primary,fg=$color_base03,bold"
set -g message-command-style "bg=$color_base02,fg=$color_base1"

# ----------------------------------------------------------------
# COPY MODE STYLING
# ----------------------------------------------------------------
# Copy mode colors (pale steel when in copy mode with prefix)
setw -g mode-style "bg=$color_bright,fg=$color_base03,bold"

# ----------------------------------------------------------------
# CLOCK STYLING
# ----------------------------------------------------------------
# Clock mode colors
setw -g clock-mode-colour "$color_primary"
setw -g clock-mode-style 12

# ----------------------------------------------------------------
# PLUGIN CONFIGURATION (Commented out but ready to use)
# ----------------------------------------------------------------
# List of plugins
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
