[color]

;; Use pywal.sh in scripts directory to use colors from an image/wallpaper.

;; Cozy Mint, coordinated with the wallpaper
; AARRGGBB: slightly translucent; picom skips blur for the bar
background = #E6191B19
foreground = #EEE8DC
foreground-alt = #ABAFA4

;; accent colors
primary = #A7CCAE
accent = #C0AFD5
muted = #ABAFA4
urgent = #DBA0AA

;; Quiet sage groups instead of saturated blue blocks
shade1 = #222622
shade2 = #272C27
shade3 = #2C322C
shade4 = #303730
shade5 = #354035
shade6 = #3A453A
shade7 = #3F4A3F
shade8 = #46534A

