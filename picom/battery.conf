# Keep compositing for translucent apps, with no decorative effects.
backend = "glx";
vsync = true;
use-damage = true;
# Fullscreen video and games bypass compositing; the delay avoids flicker on brief switches.
unredir-if-possible = true;
unredir-if-possible-delay = 1000;
# Keep the normal profile's NVIDIA synchronization workarounds.
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
xrender-sync-fence = true;
glx-copy-from-front = false;
shadow = false;
fading = false;
animations = ();
blur-method = "none";
blur-background = false;
corner-radius = 0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
force-win-blend = false;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
log-level = "error";
