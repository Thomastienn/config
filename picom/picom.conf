# ================================================================
# PICOM CONFIGURATION
# Cozy Mint - frosted glass compositor for i3
# ================================================================

# ================================================================
# BACKEND & PERFORMANCE
# ================================================================
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
# Custom tab shaders expose transparent outer corners.
force-win-blend = true;

# Stability fixes
xrender-sync-fence = true;
glx-copy-from-front = false;

# ================================================================
# SHADOWS (Soft, floating cards)
# ================================================================
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
# Offset of -radius centers the shadow; -12 on y drops it slightly below.
shadow-offset-x = -18;
shadow-offset-y = -12;

shadow-exclude = [
    "class_g = 'i3-frame'",
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'slop'",
    "class_g = 'Conky'",
    "window_type = 'menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'"
];

# ================================================================
# FADING (Smooth open/close)
# ================================================================
fading = true;
fade-in-step = 0.05;
# Keep fade-out short: picom 10.2 aborts (map_win_start assert) if a window
# id is re-mapped while still fading out, which i3's tab frames do constantly.
fade-out-step = 0.08;
fade-delta = 6;

fade-exclude = [
    "class_g = 'slop'",
    "class_g = 'i3-frame'"
];

# ================================================================
# ANIMATIONS (picom >= 12; older picom ignores this block)
# Open/close only: a quick scale + fade. Workspace switches keep the plain fade.
# ================================================================
animations = (
    {
        triggers = ["open"];
        preset = "appear";
        duration = 0.10;
        scale = 0.94;
    },
    {
        triggers = ["close"];
        preset = "disappear";
        duration = 0.10;
        scale = 0.94;
    }
);

# ================================================================
# TRANSPARENCY / OPACITY
# Focused window stays solid; unfocused ones turn slightly glassy over the blur.
# Panels own their translucency (kitty background_opacity, alpha colors in
# rofi/dunst/polybar), so they and media are pinned at 100 here.
# ================================================================
inactive-opacity = 0.90;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:fullscreen",
    "100:class_g = 'mpv'",
    "100:class_g = 'vlc'",
    "100:class_g = 'Conky'",
    "100:class_g = 'Polybar'",
    "100:class_g = 'Dunst'",
    "100:class_g = 'Rofi'",
    "100:class_g = 'slop'",
    "100:class_g = 'i3-frame'"
];

# ================================================================
# CORNERS
# ================================================================
corner-radius = 14;
rounded-corners-exclude = [
    "class_g = 'i3-frame'",
    "_THOMAS_I3_TAB_BODY@:c = 1",
    "class_g = 'Polybar'",
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

# i3 draws tab headers separately; their shaders round only outer corners.
window-shader-fg-rule = [
    "/home/thomas/thomas_config/picom/shaders/window-edge.glsl:(window_type = 'normal' || window_type = 'dialog') && class_g != 'i3-frame' && class_g != 'Conky' && class_g != 'Rofi' && !fullscreen",
    "/home/thomas/thomas_config/picom/shaders/tab-header.glsl:class_g = 'i3-frame' && height > 4 && !fullscreen"
];

# ================================================================
# BLUR - frosted glass behind translucent windows (opaque ones cost nothing)
# ================================================================
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
    "class_g = 'slop'",
    "class_g = 'i3-frame'",
    # Polybar's transparent outer margin would show as a frosted box.
    "class_g = 'Polybar'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ================================================================
# GENERAL SETTINGS
# ================================================================
# run.sh supervises picom in the foreground and restarts it after a crash.
daemon = false;
dbus = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
log-level = "error";

# ================================================================
# WINDOW TYPE SETTINGS
# ================================================================
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 1.0; shadow = false; };
    dropdown_menu = { opacity = 1.0; shadow = false; };
};
