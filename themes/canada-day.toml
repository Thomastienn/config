# Canada Day: Maple red and warm white.
# Apply with: theme apply themes/canada-day.toml
name = "Canada Day Maple"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C191A"
surface = "#2F282A"
text = "#F2E6DE"
muted = "#B7A9A8"
primary = "#DDA1A7"
secondary = "#F1E2DA"
warning = "#DEC28A"
error = "#DCA1A8"
border = "#5B4A4D"
separator = "#786164"
selection = "#4A353C"
urgent_background = "#3C272B"
pane_border = "#3A3032"
gradient_start = "#37282A"
gradient_end = "#352729"
menu_text = "#FFFFFF"
panel_separator = "#6F5E60"
shade1 = "#292324"
shade3 = "#362D2F"
shade4 = "#3C3234"
shade5 = "#48383A"
shade6 = "#4D3D3F"
shade7 = "#524244"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C191A", "#E26C7A", "#9CBA74", "#E9C08A",
  "#85B2C5", "#9B7EB1", "#85B2C5", "#F2E6DE",
  "#5B4A4D", "#EA828D", "#A3C76F", "#F4C78A",
  "#84C1D9", "#AF8ECA", "#84C1D9", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
