# Canada Day: Maple red and warm white.
# Apply with: theme apply themes/canada-day.toml
name = "Canada Day Maple"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1919"
surface = "#2F2928"
text = "#F2E0DE"
muted = "#B7A9A8"
primary = "#D85A5A"
secondary = "#EFE7DC"
warning = "#DEC28A"
error = "#DCA1A8"
border = "#5B4B4A"
separator = "#786361"
selection = "#44302F"
urgent_background = "#3C2727"
pane_border = "#3A3130"
gradient_start = "#362727"
gradient_end = "#2F2A28"
menu_text = "#FFFFFF"
panel_separator = "#6F5F5E"
shade1 = "#292423"
shade3 = "#362E2D"
shade4 = "#3C3332"
shade5 = "#483938"
shade6 = "#4D3E3D"
shade7 = "#524342"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1919", "#E26C7A", "#9CBA74", "#E9C08A",
  "#85B2C5", "#9B7EB1", "#85B2C5", "#F2E0DE",
  "#5B4B4A", "#EA828D", "#A3C76F", "#F4C78A",
  "#84C1D9", "#AF8ECA", "#84C1D9", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
