# Tet Doan Ngo: Plum purple and rice gold.
# Apply with: theme apply themes/tet-doan-ngo.toml
name = "Tet Doan Ngo"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#211726"
surface = "#33283B"
text = "#F6EDE7"
muted = "#E8D7E4"
primary = "#C7A5DE"
secondary = "#D6C58D"
warning = "#EDD08E"
error = "#EDA0AF"
border = "#584663"
separator = "#6D587B"
selection = "#403542"
urgent_background = "#422535"
pane_border = "#35283C"
gradient_start = "#322538"
gradient_end = "#332830"
menu_text = "#F6EDE7"
panel_separator = "#6D587B"
shade1 = "#281D2D"
shade3 = "#2E2235"
shade4 = "#322639"
shade5 = "#37293E"
shade6 = "#3B2D43"
shade7 = "#3F3147"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Purple"
