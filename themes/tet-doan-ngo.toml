# Tet Doan Ngo: Herb-leaf green and midday gold.
# Apply with: theme apply themes/tet-doan-ngo.toml
name = "Tet Doan Ngo"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1C1A"
surface = "#2C2F29"
text = "#EAF0E1"
muted = "#B0B4AA"
primary = "#A3C78A"
secondary = "#E3BD6E"
warning = "#DCC38A"
error = "#DBA0AB"
border = "#53584C"
separator = "#6E7563"
selection = "#363F2E"
urgent_background = "#392929"
pane_border = "#353831"
gradient_start = "#283024"
gradient_end = "#302C21"
menu_text = "#FFFFFF"
panel_separator = "#676C5F"
shade1 = "#262823"
shade3 = "#32352E"
shade4 = "#383B33"
shade5 = "#404539"
shade6 = "#464B3E"
shade7 = "#4B5043"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark"
gtk3 = "Mint-Y-Dark"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1C1A", "#DE6E81", "#9DBA6F", "#E4C190",
  "#86B2BF", "#967FB7", "#86B2BF", "#EAF0E1",
  "#53584C", "#E78495", "#A3C76A", "#F0C890",
  "#85C1D4", "#AA8FD0", "#85C1D4", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
