# Tet Doan Ngo: Plum purple and rice gold.
# Apply with: theme apply themes/tet-doan-ngo.toml
name = "Tet Doan Ngo"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1C"
surface = "#2C292F"
text = "#F0E7E1"
muted = "#B4AAB1"
primary = "#C3ADD3"
secondary = "#D6C58D"
warning = "#DCC38A"
error = "#DBA0AB"
border = "#534C58"
separator = "#6E6375"
selection = "#433845"
urgent_background = "#3A2731"
pane_border = "#353138"
gradient_start = "#312934"
gradient_end = "#32282F"
menu_text = "#FFFFFF"
panel_separator = "#675F6C"
shade1 = "#262328"
shade3 = "#322E35"
shade4 = "#38333B"
shade5 = "#413945"
shade6 = "#463E4B"
shade7 = "#4B4350"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Purple"
gtk3 = "Mint-Y-Dark-Purple"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1C", "#DE6E81", "#9DBA6F", "#E4C190",
  "#86B2BF", "#967FB7", "#86B2BF", "#F0E7E1",
  "#534C58", "#E78495", "#A3C76A", "#F0C890",
  "#85C1D4", "#AA8FD0", "#85C1D4", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
