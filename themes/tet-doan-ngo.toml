wm = "Mint-Y"

[terminal]
ansi = [
  "#211726", "#E17184", "#9FBD71", "#E1BF8E",
  "#89B5C2", "#9B84BD", "#89B5C2", "#F6EDE7",
  "#584663", "#E88596", "#A5C96C", "#ECC58D",
  "#86C2D5", "#AD92D3", "#86C2D5", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
