wm = "Mint-Y"

[terminal]
ansi = [
  "#211D26", "#E57984", "#A1B975", "#E6C78E",
  "#8AB1C6", "#A08CBD", "#8AB1C6", "#F9F2E7",
  "#656063", "#EC8D96", "#A6C570", "#F1CD8D",
  "#87BFD9", "#B19AD4", "#87BFD9", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
