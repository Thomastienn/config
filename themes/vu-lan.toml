# Vu Lan: White rose and muted rose pink.
# Apply with: theme apply themes/vu-lan.toml
name = "Vu Lan Rose"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1C"
surface = "#2B292F"
text = "#EFE8DD"
muted = "#B3ACA3"
primary = "#E7E2D9"
secondary = "#DBA1AA"
warning = "#DFC18A"
error = "#DDA1A8"
border = "#524E50"
separator = "#6B6767"
selection = "#413844"
urgent_background = "#3A2730"
pane_border = "#363138"
gradient_start = "#2F2A31"
gradient_end = "#312831"
menu_text = "#FFFFFF"
panel_separator = "#666162"
shade1 = "#262428"
shade3 = "#322E35"
shade4 = "#38333A"
shade5 = "#3F3A41"
shade6 = "#443F46"
shade7 = "#49454A"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Grey"
gtk3 = "Mint-Y-Dark-Grey"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1C", "#DC717C", "#A1B975", "#E2C38A",
  "#89B0C5", "#9581B1", "#89B0C5", "#EFE8DD",
  "#524E50", "#E5868F", "#A7C671", "#EECA8A",
  "#88C0DA", "#A891CB", "#88C0DA", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
