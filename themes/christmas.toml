# Christmas: Evergreen, holly red, warm white.
# Apply with: theme apply themes/christmas.toml
name = "Evergreen Christmas"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1A"
surface = "#262C28"
text = "#EBE9DC"
muted = "#A9B0A5"
primary = "#A8CCAD"
secondary = "#E1A4A1"
warning = "#E0BF8A"
error = "#DDA1A7"
border = "#46534A"
separator = "#5C6D5F"
selection = "#334034"
urgent_background = "#332B2A"
pane_border = "#2D3530"
gradient_start = "#233028"
gradient_end = "#262E26"
menu_text = "#FFFFFF"
panel_separator = "#5A675C"
shade1 = "#212623"
shade3 = "#2B322E"
shade4 = "#2E3732"
shade5 = "#324038"
shade6 = "#37453D"
shade7 = "#3D4A41"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark"
gtk3 = "Mint-Y-Dark"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#181B1A", "#D9747B", "#A2B872", "#DEC589",
  "#8BB0C3", "#9183AF", "#8BB0C3", "#EBE9DC",
  "#46534A", "#E1898D", "#A8C56E", "#EACC89",
  "#8ABFD8", "#A493C9", "#8ABFD8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
