# Vietnam Reunification: Flag red and star gold.
# Apply with: theme apply themes/vietnam-reunification.toml
name = "Vietnam Reunification"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1D1A19"
surface = "#302A28"
text = "#F1E1DD"
muted = "#B7A9A6"
primary = "#DA5E4E"
secondary = "#E5C35F"
warning = "#DBC38A"
error = "#DDA1A8"
border = "#5B4D49"
separator = "#79645F"
selection = "#4A3530"
urgent_background = "#3C2729"
pane_border = "#3A3230"
gradient_start = "#382725"
gradient_end = "#342C22"
menu_text = "#FFFFFF"
panel_separator = "#6F605C"
shade1 = "#292423"
shade3 = "#372F2D"
shade4 = "#3C3331"
shade5 = "#483A37"
shade6 = "#4D3F3C"
shade7 = "#524441"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
