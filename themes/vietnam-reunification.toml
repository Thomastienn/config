# Vietnam Reunification: Deep red, coral red, flag gold.
# Apply with: theme apply themes/vietnam-reunification.toml
name = "Vietnam Reunification"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1D1A19"
surface = "#302828"
text = "#F1E6DD"
muted = "#B7AAA6"
primary = "#E2A69E"
secondary = "#D7C48B"
warning = "#DBC38A"
error = "#DDA1A8"
border = "#5B4B49"
separator = "#79625F"
selection = "#4B3631"
urgent_background = "#3C2729"
pane_border = "#3A3030"
gradient_start = "#372827"
gradient_end = "#342823"
menu_text = "#FFFFFF"
panel_separator = "#6F5E5C"
shade1 = "#292323"
shade3 = "#372E2D"
shade4 = "#3C3231"
shade5 = "#483837"
shade6 = "#4D3D3C"
shade7 = "#524241"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1D1A19", "#E16D78", "#9EBA6A", "#E9C088",
  "#88B3BC", "#9C7EAF", "#88B3BC", "#F1E6DD",
  "#5B4B49", "#EA838C", "#A4C766", "#F4C788",
  "#88C1D0", "#AF8EC8", "#88C1D0", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
