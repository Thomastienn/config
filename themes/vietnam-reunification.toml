# Vietnam Reunification: Deep red, coral red, flag gold.
# Apply with: theme apply themes/vietnam-reunification.toml
name = "Vietnam Reunification"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#2C1515"
surface = "#412727"
text = "#FAEDE2"
muted = "#F8D7CC"
primary = "#F5A39A"
secondary = "#F4D67D"
warning = "#F0D28C"
error = "#F0A0AA"
border = "#6E4441"
separator = "#885652"
selection = "#4F352E"
urgent_background = "#4A2428"
pane_border = "#442625"
gradient_start = "#402322"
gradient_end = "#40281F"
menu_text = "#FAEDE2"
panel_separator = "#885652"
shade1 = "#341B1A"
shade3 = "#3C2020"
shade4 = "#412423"
shade5 = "#462726"
shade6 = "#4B2B2A"
shade7 = "#502F2D"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#2C1515", "#E6717C", "#A3BF6F", "#E7BE86",
  "#8CB7C0", "#A183B4", "#8CB7C0", "#FAEDE2",
  "#6E4441", "#ED858E", "#A8CB6A", "#F1C485",
  "#8AC4D3", "#B291CB", "#8AC4D3", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
