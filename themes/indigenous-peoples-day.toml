# National Indigenous Peoples Day: Earth and summer sage; no borrowed sacred motifs.
# Apply with: theme apply themes/indigenous-peoples-day.toml
name = "National Indigenous Peoples Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2E2A24"
text = "#EFE8DC"
muted = "#B2ACA2"
primary = "#D9C196"
secondary = "#A2C9B8"
warning = "#D9C38B"
error = "#DEA1A7"
border = "#564E42"
separator = "#716755"
selection = "#403C30"
urgent_background = "#3C2726"
pane_border = "#37322B"
gradient_start = "#332B20"
gradient_end = "#2D2C23"
menu_text = "#FFFFFF"
panel_separator = "#696255"
shade1 = "#282420"
shade3 = "#342F29"
shade4 = "#39342C"
shade5 = "#433B2F"
shade6 = "#484034"
shade7 = "#4D4539"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#DE7077", "#98BC74", "#E4C286",
  "#80B3C4", "#9780AD", "#80B3C4", "#EFE8DC",
  "#564E42", "#E6868B", "#9EC870", "#EFC985",
  "#7FC2DA", "#AA91C6", "#7FC2DA", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
