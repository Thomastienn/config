# Vietnam Women Day: Lotus pink and sage.
# Apply with: theme apply themes/vietnam-women-day.toml
name = "Vietnam Women Day Lotus"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A1B"
surface = "#2E282D"
text = "#F2E6DF"
muted = "#B6A9AD"
primary = "#D2A5C1"
secondary = "#AFCCAC"
warning = "#D9C48B"
error = "#DCA0A9"
border = "#584B53"
separator = "#74626E"
selection = "#463641"
urgent_background = "#3A272F"
pane_border = "#383036"
gradient_start = "#342831"
gradient_end = "#32272F"
menu_text = "#FFFFFF"
panel_separator = "#6C5E67"
shade1 = "#282326"
shade3 = "#352E33"
shade4 = "#3A3238"
shade5 = "#453841"
shade6 = "#4A3D46"
shade7 = "#4F424B"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Pink"
gtk3 = "Mint-Y-Dark-Pink"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A1B", "#E06D7E", "#99BB73", "#E7C08E",
  "#81B3C3", "#9A7EB4", "#81B3C3", "#F2E6DF",
  "#584B53", "#E98392", "#9FC86E", "#F3C78E",
  "#80C2D8", "#AD8ECE", "#80C2D8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
