# Tet Nguyen Dan: Apricot gold and lucky red.
# Apply with: theme apply themes/tet.toml
name = "Apricot Tet"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1D191A"
surface = "#302829"
text = "#EFE8DC"
muted = "#B2ACA2"
primary = "#DFC18A"
secondary = "#E2A59F"
warning = "#E0C08A"
error = "#DFA2A4"
border = "#594D43"
separator = "#746556"
selection = "#4B3637"
urgent_background = "#3C2729"
pane_border = "#3A302E"
gradient_start = "#372825"
gradient_end = "#352728"
menu_text = "#FFFFFF"
panel_separator = "#6C6155"
shade1 = "#292323"
shade3 = "#372E2C"
shade4 = "#3C3230"
shade5 = "#483834"
shade6 = "#4D3E38"
shade7 = "#52433D"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1D191A", "#DF7072", "#A2B872", "#E5C283",
  "#8BB0C2", "#9980A8", "#8BB0C2", "#EFE8DC",
  "#594D43", "#E88585", "#A9C56E", "#F1C982",
  "#8ABFD8", "#AD91C2", "#8ABFD8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
