# Victoria Day: Royal plum and gold.
# Apply with: theme apply themes/victoria-day.toml
name = "Victoria Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1C"
surface = "#2B292F"
text = "#EFE7E1"
muted = "#B3AAB3"
primary = "#BFAFD6"
secondary = "#DCC38A"
warning = "#DDC28A"
error = "#DBA0AB"
border = "#514D5A"
separator = "#6B6477"
selection = "#413849"
urgent_background = "#382834"
pane_border = "#343139"
gradient_start = "#2E2A36"
gradient_end = "#2F2833"
menu_text = "#FFFFFF"
panel_separator = "#65606E"
shade1 = "#252429"
shade3 = "#312F36"
shade4 = "#36333C"
shade5 = "#3E3A47"
shade6 = "#433F4C"
shade7 = "#484451"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Purple"
gtk3 = "Mint-Y-Dark-Purple"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1C", "#DD6F83", "#9DBA6D", "#E4C190",
  "#87B2BE", "#957FB8", "#87B2BE", "#EFE7E1",
  "#514D5A", "#E68595", "#A4C76A", "#EFC991",
  "#86C1D3", "#A98FD1", "#86C1D3", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
