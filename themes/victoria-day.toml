# Victoria Day: Royal plum and gold.
# Apply with: theme apply themes/victoria-day.toml
name = "Victoria Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#221B31"
surface = "#342C45"
text = "#F6EEE8"
muted = "#E8DBE8"
primary = "#C8AFE9"
secondary = "#EDD398"
warning = "#F0D18F"
error = "#EDA1B0"
border = "#594C6E"
separator = "#6E5F86"
selection = "#43394C"
urgent_background = "#43283E"
pane_border = "#362D47"
gradient_start = "#332A43"
