# National Day for Truth and Reconciliation: Orange and quiet linen.
# Apply with: theme apply themes/truth-and-reconciliation.toml
name = "Truth and Reconciliation"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2F2925"
text = "#F0E7DC"
muted = "#B4ABA3"
primary = "#E5B58D"
secondary = "#D8CBB9"
warning = "#DDC28A"
error = "#DEA2A6"
border = "#594D43"
separator = "#756457"
selection = "#49382D"
urgent_background = "#3C2726"
pane_border = "#39312C"
gradient_start = "#362A22"
gradient_end = "#342922"
menu_text = "#FFFFFF"
panel_separator = "#6D6056"
shade1 = "#292421"
shade3 = "#362E2A"
shade4 = "#3B332D"
shade5 = "#473931"
shade6 = "#4C3E36"
shade7 = "#50443B"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Orange"
gtk3 = "Mint-Y-Dark-Orange"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#E16E73", "#9CBA73", "#E7C184",
  "#85B2C4", "#9A7FAB", "#85B2C4", "#F0E7DC",
  "#594D43", "#E98487", "#A3C76E", "#F3C883",
  "#84C1D8", "#AE90C3", "#84C1D8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
