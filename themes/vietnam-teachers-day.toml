# Vietnam Teachers Day: Chalk green and ochre.
# Apply with: theme apply themes/vietnam-teachers-day.toml
name = "Vietnam Teachers Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#191B19"
surface = "#282C26"
text = "#EDE8DC"
muted = "#AEAEA3"
primary = "#BFCA98"
secondary = "#E2BB8B"
warning = "#DEC28A"
error = "#DEA2A6"
border = "#4D5144"
separator = "#656B58"
selection = "#393F2E"
urgent_background = "#392929"
pane_border = "#31342D"
gradient_start = "#292F23"
gradient_end = "#2B2C22"
menu_text = "#FFFFFF"
panel_separator = "#616557"
shade1 = "#232621"
shade3 = "#2E322B"
shade4 = "#32362E"
shade5 = "#393F32"
shade6 = "#3E4437"
shade7 = "#43493C"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark"
gtk3 = "Mint-Y-Dark"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#191B19", "#DC7277", "#9FBA6F", "#E1C484",
  "#88B2C0", "#9482AC", "#88B2C0", "#EDE8DC",
  "#4D5144", "#E48889", "#A6C76B", "#EDCB84",
  "#88C1D5", "#A793C5", "#88C1D5", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
