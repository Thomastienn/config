# Boxing Day: Ice blue and silver lilac.
# Apply with: theme apply themes/boxing-day.toml
name = "Boxing Day Winter"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1C"
surface = "#252B2F"
text = "#EBE8E0"
muted = "#A5B0AF"
primary = "#9DC7D8"
secondary = "#BEBBD9"
warning = "#DDC28A"
error = "#DBA0AA"
border = "#44525A"
separator = "#566C76"
selection = "#2E3E4A"
urgent_background = "#352936"
pane_border = "#2C3439"
gradient_start = "#212E36"
gradient_end = "#232C35"
menu_text = "#FFFFFF"
panel_separator = "#56666D"
shade1 = "#212529"
shade3 = "#2A3136"
shade4 = "#2D363C"
shade5 = "#313F47"
shade6 = "#36444C"
shade7 = "#3B4952"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Aqua"
gtk3 = "Mint-Y-Dark-Aqua"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#181B1C", "#D87382", "#9BBA78", "#DDC48F",
  "#84B2C8", "#9082B5", "#84B2C8", "#EBE8E0",
  "#44525A", "#E18894", "#A2C775", "#E9CC8F",
  "#83C1DD", "#A392CF", "#83C1DD", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
