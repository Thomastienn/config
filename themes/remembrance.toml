# Remembrance Day: Poppy red and khaki on charcoal.
# Apply with: theme apply themes/remembrance.toml
name = "Remembrance Day Poppy"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1A"
surface = "#2D2B2A"
text = "#EBE6E4"
muted = "#B2AFAD"
primary = "#D9604F"
secondary = "#BDB38E"
warning = "#DDC28A"
error = "#DDA1A8"
border = "#555250"
separator = "#716B68"
selection = "#45302C"
urgent_background = "#3C2725"
pane_border = "#363433"
gradient_start = "#352725"
gradient_end = "#2C2B26"
menu_text = "#FFFFFF"
panel_separator = "#696664"
shade1 = "#272625"
shade3 = "#333130"
shade4 = "#393635"
shade5 = "#433F3D"
shade6 = "#484442"
shade7 = "#4D4947"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1A", "#E16D7A", "#9CBA73", "#E9C08A",
  "#85B2C4", "#9B7EB0", "#85B2C4", "#EBE6E4",
  "#555250", "#EA828D", "#A2C76F", "#F5C789",
  "#83C1D8", "#AF8ECA", "#83C1D8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
