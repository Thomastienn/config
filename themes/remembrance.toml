# Remembrance Day: Poppy red and stone on charcoal wine.
# Apply with: theme apply themes/remembrance.toml
name = "Remembrance Day Poppy"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C191B"
surface = "#2F282B"
text = "#F2E6DD"
muted = "#B7AAA8"
primary = "#DDA1A7"
secondary = "#D5CCBD"
warning = "#DDC28A"
error = "#DDA1A8"
border = "#5B4A4C"
separator = "#786164"
selection = "#46373D"
urgent_background = "#3C272C"
pane_border = "#393032"
gradient_start = "#37282B"
gradient_end = "#32282A"
menu_text = "#FFFFFF"
panel_separator = "#6F5E60"
shade1 = "#292325"
shade3 = "#362D30"
shade4 = "#3C3234"
shade5 = "#48383B"
shade6 = "#4D3D40"
shade7 = "#524245"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Red"
gtk3 = "Mint-Y-Dark-Red"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C191B", "#E16D7A", "#9CBA73", "#E9C08A",
  "#85B2C4", "#9B7EB0", "#85B2C4", "#F2E6DD",
  "#5B4A4C", "#EA828D", "#A2C76F", "#F5C789",
  "#83C1D8", "#AF8ECA", "#83C1D8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
