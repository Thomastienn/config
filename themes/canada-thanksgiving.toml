# Canada Thanksgiving: Maple gold and harvest sage.
# Apply with: theme apply themes/canada-thanksgiving.toml
name = "Canada Thanksgiving Harvest"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2E2A24"
text = "#EEE8DC"
muted = "#B2ACA2"
primary = "#DFC08A"
secondary = "#BCCA9A"
warning = "#DAC38B"
error = "#DEA2A5"
border = "#564E42"
separator = "#716655"
selection = "#443B29"
urgent_background = "#3C2725"
pane_border = "#37322B"
gradient_start = "#332B20"
gradient_end = "#302B20"
menu_text = "#FFFFFF"
panel_separator = "#6A6255"
shade1 = "#282420"
shade3 = "#342F29"
shade4 = "#39342C"
shade5 = "#443B2F"
shade6 = "#494034"
shade7 = "#4E4539"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#DF7074", "#9ABB6F", "#E6C283",
  "#83B3C0", "#9880AA", "#83B3C0", "#EEE8DC",
  "#564E42", "#E88587", "#A0C86B", "#F0C982",
  "#82C2D5", "#AC91C3", "#82C2D5", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
