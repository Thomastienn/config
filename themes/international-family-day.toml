# International Family Day: Warm terracotta and sage.
# Apply with: theme apply themes/international-family-day.toml
name = "International Family Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2F2925"
text = "#F0E7DC"
muted = "#B4ACA3"
primary = "#E0B995"
secondary = "#A2CCB8"
warning = "#D8C48B"
error = "#DEA2A6"
border = "#594D43"
separator = "#756556"
selection = "#413B32"
urgent_background = "#3C2728"
pane_border = "#39312C"
gradient_start = "#352A22"
gradient_end = "#2F2B24"
menu_text = "#FFFFFF"
panel_separator = "#6C6056"
shade1 = "#292421"
shade3 = "#362E2A"
shade4 = "#3B332E"
shade5 = "#473A31"
shade6 = "#4B3F36"
shade7 = "#50443B"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#DF6F77", "#97BC74", "#E6C286",
  "#80B3C4", "#9880AE", "#80B3C4", "#F0E7DC",
  "#594D43", "#E8858A", "#9EC970", "#F1C986",
  "#7FC2DA", "#AC90C7", "#7FC2DA", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
