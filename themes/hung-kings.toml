# Hung Kings Commemoration: Bronze and temple green.
# Apply with: theme apply themes/hung-kings.toml
name = "Hung Kings Commemoration"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#251E14"
surface = "#383122"
text = "#F8EFE0"
muted = "#EFE0C4"
primary = "#DBBD84"
secondary = "#AFC7A6"
warning = "#EAD090"
error = "#EEA2A8"
border = "#615239"
separator = "#796748"
selection = "#423D2D"
urgent_background = "#452A28"
pane_border = "#3B3121"
gradient_start = "#372E1F"
gradient_end = "#332F23"
menu_text = "#F8EFE0"
