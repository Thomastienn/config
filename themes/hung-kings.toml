# Hung Kings Commemoration: Bronze and temple green.
# Apply with: theme apply themes/hung-kings.toml
name = "Hung Kings Commemoration"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2D2A24"
text = "#EFE8DC"
muted = "#B2ACA2"
primary = "#DFC18A"
secondary = "#B2CAA9"
warning = "#DAC38B"
error = "#DEA2A6"
border = "#564E42"
separator = "#716655"
selection = "#413C2C"
urgent_background = "#3C2726"
pane_border = "#37322B"
gradient_start = "#322B20"
gradient_end = "#2F2B20"
menu_text = "#FFFFFF"
panel_separator = "#696255"
shade1 = "#272420"
shade3 = "#342F29"
shade4 = "#39342C"
shade5 = "#433B2F"
shade6 = "#484134"
shade7 = "#4D4539"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#DE7075", "#99BB72", "#E5C284",
  "#82B3C3", "#9780AC", "#82B3C3", "#EFE8DC",
  "#564E42", "#E78588", "#9FC86E", "#F0CA84",
  "#80C2D7", "#AB91C5", "#80C2D7", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
