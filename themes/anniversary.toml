# Anniversary: Rose and champagne gold.
# Apply with: theme apply themes/anniversary.toml
name = "Anniversary Rose Gold"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A1C"
surface = "#2D292E"
text = "#F2E6DE"
muted = "#B7A9AB"
primary = "#D5A3BB"
secondary = "#DEC28A"
warning = "#DDC28A"
error = "#DCA0A9"
border = "#584B53"
separator = "#75616D"
selection = "#473641"
urgent_background = "#3A2730"
pane_border = "#373036"
gradient_start = "#332832"
gradient_end = "#34272C"
menu_text = "#FFFFFF"
panel_separator = "#6C5E66"
shade1 = "#272327"
shade3 = "#342E33"
