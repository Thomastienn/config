# Alberta Heritage Day: Prairie sky blue and wheat gold.
# Apply with: theme apply themes/alberta-heritage-day.toml
name = "Alberta Heritage Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#191B1D"
surface = "#262B30"
text = "#ECE8E1"
muted = "#A5AFB5"
primary = "#9FBFDE"
secondary = "#DBC38A"
warning = "#DDC28A"
error = "#DBA0AB"
border = "#47505B"
separator = "#5B6A79"
selection = "#313E49"
urgent_background = "#342939"
pane_border = "#2E333A"
gradient_start = "#242D38"
gradient_end = "#242C34"
menu_text = "#FFFFFF"
panel_separator = "#59646F"
shade1 = "#222529"
shade3 = "#2C3137"
shade4 = "#2F353D"
shade5 = "#343D49"
shade6 = "#39424E"
shade7 = "#3E4853"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Blue"
gtk3 = "Mint-Y-Dark-Blue"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#191B1D", "#D87384", "#9DBA6C", "#DEC492",
  "#87B2BD", "#9082B7", "#87B2BD", "#ECE8E1",
  "#47505B", "#E18897", "#A5C769", "#E9CB91",
  "#86C1D2", "#A492D1", "#86C1D2", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
