# New Year: Midnight blue, champagne gold, ice blue.
# Apply with: theme apply themes/new-year.toml
name = "Midnight New Year"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#191A1D"
surface = "#272B30"
text = "#EEE8DC"
muted = "#B1ADA2"
primary = "#D9C48B"
secondary = "#9BC1DD"
warning = "#DAC38B"
error = "#DFA2A4"
border = "#524F42"
separator = "#6D6855"
selection = "#323D4C"
urgent_background = "#352838"
pane_border = "#2F3438"
gradient_start = "#272D32"
gradient_end = "#252C36"
menu_text = "#FFFFFF"
panel_separator = "#676355"
shade1 = "#222529"
shade3 = "#2B3137"
shade4 = "#30363B"
shade5 = "#393D40"
shade6 = "#3E4242"
shade7 = "#454745"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Blue"
gtk3 = "Mint-Y-Dark-Blue"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#191A1D", "#DE7072", "#96BC7B", "#E4C283",
  "#7FB3CA", "#9981A8", "#7FB3CA", "#EEE8DC",
  "#524F42", "#E78685", "#9CC876", "#F0CA82",
  "#7DC2DF", "#AC91C2", "#7DC2DF", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
