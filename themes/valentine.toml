# Valentine: Wine, rose pink, soft blush.
# Apply with: theme apply themes/valentine.toml
name = "Valentine Rose"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C191B"
surface = "#2F282C"
text = "#F2E6DE"
muted = "#B7A9AA"
primary = "#D8A2B4"
secondary = "#D4AEC3"
warning = "#DFC18A"
error = "#DCA0A9"
border = "#594A50"
separator = "#776169"
selection = "#48363F"
urgent_background = "#3B272E"
pane_border = "#393034"
gradient_start = "#35282E"
gradient_end = "#33272E"
menu_text = "#FFFFFF"
panel_separator = "#6E5E63"
shade1 = "#282325"
shade3 = "#362D31"
shade4 = "#3B3236"
shade5 = "#46383E"
shade6 = "#4C3D43"
shade7 = "#514248"

[fonts]
