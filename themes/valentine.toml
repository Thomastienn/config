# Valentine: Red rose and warm cream.
# Apply with: theme apply themes/valentine.toml
name = "Valentine Rose"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1919"
surface = "#2F2928"
text = "#F2E0DE"
muted = "#B7AAA9"
primary = "#D95F6B"
secondary = "#EFDCCB"
warning = "#DFC18A"
error = "#DCA0A9"
border = "#594B4A"
separator = "#776361"
selection = "#46322F"
urgent_background = "#3C2728"
pane_border = "#393130"
gradient_start = "#37272A"
gradient_end = "#332C28"
menu_text = "#FFFFFF"
panel_separator = "#6E5F5E"
shade1 = "#282323"
shade3 = "#362E2D"
shade4 = "#3B3332"
