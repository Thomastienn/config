wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A1C", "#E16E71", "#9FB97D", "#E7C184",
  "#87B0CD", "#9C7FA9", "#87B0CD", "#F0E7DC",
  "#5A4C45", "#EA8485", "#A5C679", "#F4C883",
  "#86BFE3", "#AF90C1", "#86BFE3", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
