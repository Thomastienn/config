# Halloween: Pumpkin orange and violet.
# Apply with: theme apply themes/halloween.toml
name = "Harvest Halloween"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A1C"
surface = "#2D292E"
text = "#F0E7DC"
muted = "#B4ACA3"
primary = "#E4B78C"
secondary = "#C3ADD3"
warning = "#E0C08B"
error = "#DFA2A5"
border = "#5A4C45"
separator = "#766458"
selection = "#433746"
urgent_background = "#3A272F"
pane_border = "#3A3031"
gradient_start = "#37282B"
gradient_end = "#302832"
menu_text = "#FFFFFF"
panel_separator = "#6D6057"
shade1 = "#282326"
shade3 = "#362D30"
shade4 = "#3C3233"
shade5 = "#483838"
shade6 = "#4D3D3C"
shade7 = "#524240"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
