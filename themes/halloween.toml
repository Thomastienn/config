[terminal]
ansi = [
  "#211522", "#E77376", "#9EB87C", "#E8C080",
  "#87B0CD", "#A285AF", "#87B0CD", "#FAEEDE",
  "#6A4939", "#EE8788", "#A3C377", "#F3C67F",
  "#84BDE1", "#B393C5", "#84BDE1", "#FFF9F1",
]
