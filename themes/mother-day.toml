# Mother Day: Carnation pink and lilac.
# Apply with: theme apply themes/mother-day.toml
name = "Mother Day Carnation"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C191B"
surface = "#2F282B"
text = "#F1E6DD"
muted = "#B7A9A9"
primary = "#D8A2B4"
secondary = "#C1AED4"
warning = "#DFC18A"
error = "#DCA1A8"
border = "#594A50"
separator = "#776169"
selection = "#473640"
urgent_background = "#3B272D"
pane_border = "#393034"
gradient_start = "#36282E"
gradient_end = "#32282F"
menu_text = "#FFFFFF"
panel_separator = "#6E5E63"
shade1 = "#282326"
shade3 = "#362D31"
shade4 = "#3B3236"
shade5 = "#47383E"
shade6 = "#4C3D43"
shade7 = "#514248"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Pink"
gtk3 = "Mint-Y-Dark-Pink"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C191B", "#DF6E7D", "#9CBA79", "#E7C18B",
  "#84B1C9", "#997EB3", "#84B1C9", "#F1E6DD",
  "#594A50", "#E88490", "#A3C775", "#F3C78B",
  "#84C0DE", "#AD8ECC", "#84C0DE", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
