# Mid Autumn: Moonlit navy, lantern amber, peach.
# Apply with: theme apply themes/mid-autumn.toml
name = "Mid Autumn Lanterns"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#191A1D"
surface = "#282A30"
text = "#EEE8DC"
muted = "#B2ACA2"
primary = "#DFC18A"
secondary = "#E5AB96"
warning = "#DFC18A"
error = "#DEA2A5"
border = "#564D45"
separator = "#726655"
selection = "#393A4C"
urgent_background = "#352837"
pane_border = "#31323A"
gradient_start = "#2A2B37"
gradient_end = "#2A2A35"
menu_text = "#FFFFFF"
panel_separator = "#6A6255"
shade1 = "#232429"
shade3 = "#2E3037"
shade4 = "#33343D"
shade5 = "#3B3B46"
shade6 = "#414048"
shade7 = "#47454A"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Orange"
gtk3 = "Mint-Y-Dark-Orange"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#191A1D", "#DF7073", "#A2B971", "#E5C283",
  "#8BB1C2", "#9880AA", "#8BB1C2", "#EEE8DC",
  "#564D45", "#E88586", "#A8C66D", "#F1C982",
  "#89C0D6", "#AC91C3", "#89C0D6", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
