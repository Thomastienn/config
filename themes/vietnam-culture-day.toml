# Vietnam Culture Day: Lacquer brown, antique gold, jade.
# Apply with: theme apply themes/vietnam-culture-day.toml
name = "Vietnam Culture Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2E2A24"
text = "#EFE8DC"
muted = "#B3ACA2"
primary = "#E0BF8A"
secondary = "#B5C7BB"
warning = "#DBC38B"
error = "#DEA2A6"
border = "#574E42"
separator = "#726655"
selection = "#433B2F"
urgent_background = "#3C2726"
pane_border = "#38322B"
gradient_start = "#342B20"
gradient_end = "#302A23"
menu_text = "#FFFFFF"
panel_separator = "#6A6155"
shade1 = "#282420"
shade3 = "#352F29"
shade4 = "#3A342C"
shade5 = "#443B2F"
shade6 = "#494034"
shade7 = "#4E4539"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
