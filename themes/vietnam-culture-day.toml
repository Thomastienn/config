wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#DE7075", "#9ABB74", "#E5C284",
  "#82B3C4", "#9880AC", "#82B3C4", "#EFE8DC",
  "#574E42", "#E78588", "#A0C870", "#F1C984",
  "#81C2DA", "#AC91C5", "#81C2DA", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
