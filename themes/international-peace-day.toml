  "#181B1C", "#D97382", "#9ABB74", "#DEC490",
  "#83B3C4", "#9082B7", "#83B3C4", "#EBE8E0",
  "#435259", "#E18895", "#A1C871", "#E9CB90",
  "#82C1D9", "#A492D1", "#82C1D9", "#F6F0E8",
]
