# International Peace Day: Sky blue and olive white.
# Apply with: theme apply themes/international-peace-day.toml
name = "International Peace Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1C"
surface = "#252B30"
text = "#EBE8E0"
muted = "#A4B0B2"
primary = "#98C3DB"
secondary = "#CBD9CC"
warning = "#DCC38A"
error = "#DBA0AA"
border = "#435259"
separator = "#576B77"
selection = "#303E46"
urgent_background = "#352933"
pane_border = "#2C3439"
gradient_start = "#212F36"
gradient_end = "#212E32"
menu_text = "#FFFFFF"
panel_separator = "#56656E"
shade1 = "#202629"
shade3 = "#293236"
shade4 = "#2D363B"
shade5 = "#303F47"
shade6 = "#35444C"
shade7 = "#3B4951"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
