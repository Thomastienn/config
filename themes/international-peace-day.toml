# International Peace Day: Sky blue and olive white.
# Apply with: theme apply themes/international-peace-day.toml
name = "International Peace Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#17242B"
surface = "#293842"
text = "#F3F0E8"
muted = "#DAE6E8"
primary = "#9FCDE7"
secondary = "#D8E6D9"
warning = "#EED396"
error = "#EAA4B0"
border = "#445C69"
separator = "#567281"
selection = "#37464E"
urgent_background = "#3B2F39"
pane_border = "#273842"
gradient_start = "#25353E"
gradient_end = "#2A373C"
menu_text = "#F3F0E8"
panel_separator = "#567281"
shade1 = "#1C2B33"
shade3 = "#22323A"
shade4 = "#25363F"
shade5 = "#293A43"
shade6 = "#2C3E48"
