# Easter: Daffodil yellow and spring sky.
# Apply with: theme apply themes/easter.toml
name = "Easter Primrose"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1A1B1D"
surface = "#292C30"
text = "#E2E7EF"
muted = "#AAAEB4"
primary = "#E5C96B"
secondary = "#9CC4DE"
warning = "#DCC38A"
error = "#DBA0AB"
border = "#4E535B"
separator = "#656D79"
selection = "#323D4A"
urgent_background = "#382834"
pane_border = "#32353A"
gradient_start = "#302D22"
gradient_end = "#232D37"
menu_text = "#FFFFFF"
panel_separator = "#61676F"
shade1 = "#242629"
shade3 = "#2F3237"
shade4 = "#33373D"
shade5 = "#3A4049"
shade6 = "#40464E"
shade7 = "#454B53"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
