# Easter: Lavender and primrose yellow.
# Apply with: theme apply themes/easter.toml
name = "Easter Primrose"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1A1A1D"
surface = "#292A30"
text = "#EFE7E2"
muted = "#B1AAB4"
primary = "#BAB2DA"
secondary = "#DDC38D"
warning = "#DCC38A"
error = "#DBA0AB"
border = "#4E4E5B"
separator = "#676579"
selection = "#393B4A"
urgent_background = "#382834"
pane_border = "#32323A"
gradient_start = "#2A2B38"
