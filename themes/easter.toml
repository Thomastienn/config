  "#1A1B1D", "#DC7083", "#9EBA6E", "#E2C291",
  "#87B2BF", "#947FB8", "#87B2BF", "#E2E7EF",
  "#4E535B", "#E48696", "#A4C76A", "#EEC991",
  "#86C1D4", "#A890D1", "#86C1D4", "#F6F0E8",
]
