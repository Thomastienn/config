# Easter: Lavender and primrose yellow.
# Apply with: theme apply themes/easter.toml
name = "Easter Primrose"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#202232"
surface = "#32364B"
text = "#F6EEE9"
muted = "#E7DEEB"
primary = "#C5BAF1"
secondary = "#F0D69F"
warning = "#F0D290"
error = "#EDA2B1"
border = "#565471"
separator = "#6C688A"
selection = "#414352"
urgent_background = "#422E3E"
pane_border = "#343449"
gradient_start = "#303145"
