# Vesak: Saffron gold and pale lotus.
# Apply with: theme apply themes/vesak.toml
name = "Vesak Lotus"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#201B11"
surface = "#342D1F"
text = "#F9F1E0"
muted = "#F6E8C5"
primary = "#F0D485"
secondary = "#E7BD91"
warning = "#EFCF8E"
error = "#F0A4A8"
border = "#655837"
separator = "#807046"
selection = "#423928"
urgent_background = "#422826"
pane_border = "#39311F"
gradient_start = "#352E1D"
gradient_end = "#342B1E"
menu_text = "#F9F1E0"
panel_separator = "#807046"
shade1 = "#282216"
shade3 = "#312A1A"
shade4 = "#362E1D"
shade5 = "#3B3320"
shade6 = "#403823"
shade7 = "#453C26"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#201B11", "#E5777A", "#A1BC71", "#E6C483",
  "#8BB4C2", "#A089B2", "#8BB4C2", "#F9F1E0",
  "#655837", "#EC8B8B", "#A7C86C", "#F1CA82",
  "#88C1D6", "#B297C9", "#88C1D6", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
