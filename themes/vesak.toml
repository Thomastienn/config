# Vesak: Saffron gold and pale lotus.
# Apply with: theme apply themes/vesak.toml
name = "Vesak Lotus"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A18"
surface = "#2D2A24"
text = "#EEE8DC"
muted = "#B1ADA2"
primary = "#D8C48B"
secondary = "#E3B98D"
warning = "#DEC28A"
error = "#DFA2A5"
border = "#544F42"
separator = "#6F6754"
selection = "#443B2A"
urgent_background = "#3C2726"
pane_border = "#36332B"
gradient_start = "#312C1F"
gradient_end = "#312A20"
menu_text = "#FFFFFF"
panel_separator = "#686254"
shade1 = "#272420"
shade3 = "#333028"
shade4 = "#38342C"
shade5 = "#423C2E"
shade6 = "#464133"
shade7 = "#4C4638"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A18", "#DE7174", "#9FBA6F", "#E4C383",
  "#89B2C0", "#9881A9", "#89B2C0", "#EEE8DC",
  "#544F42", "#E78686", "#A6C76B", "#F0C982",
  "#88C1D6", "#AC91C3", "#88C1D6", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
