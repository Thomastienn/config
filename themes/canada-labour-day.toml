# Canada Labour Day: Steel blue and copper.
# Apply with: theme apply themes/canada-labour-day.toml
name = "Canada Labour Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1C"
surface = "#252C2F"
text = "#ECE9DF"
muted = "#A8AFAB"
primary = "#A5C5CD"
secondary = "#E5B38F"
warning = "#DEC28A"
error = "#DCA0A9"
border = "#425257"
separator = "#576C72"
selection = "#363E40"
urgent_background = "#352931"
pane_border = "#2B3538"
gradient_start = "#212F35"
gradient_end = "#272D2D"
menu_text = "#FFFFFF"
panel_separator = "#55666B"
shade1 = "#202628"
shade3 = "#293235"
shade4 = "#2C373A"
shade5 = "#313F45"
shade6 = "#35444A"
shade7 = "#3A494F"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Aqua"
gtk3 = "Mint-Y-Dark-Aqua"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#181B1C", "#DA7280", "#A0B970", "#DFC48D",
  "#89B2C1", "#9182B4", "#89B2C1", "#ECE9DF",
  "#425257", "#E28892", "#A6C66B", "#EACB8D",
  "#88C0D5", "#A592CE", "#88C0D5", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
