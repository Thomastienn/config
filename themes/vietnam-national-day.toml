# Vietnam National Day: Flag gold and red on dark ochre.
# Apply with: theme apply themes/vietnam-national-day.toml
name = "Vietnam National Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#291D12"
surface = "#3D3020"
text = "#FAF1DE"
muted = "#F9E9BD"
primary = "#F6D66F"
secondary = "#F1A49B"
warning = "#F0CC8F"
error = "#F0A4A6"
border = "#6D5A31"
separator = "#87723D"
selection = "#4B392A"
urgent_background = "#482A26"
pane_border = "#42331D"
gradient_start = "#3E301B"
gradient_end = "#3D2A20"
menu_text = "#FAF1DE"
panel_separator = "#87723D"
shade1 = "#312416"
shade3 = "#392C19"
shade4 = "#3F301C"
shade5 = "#44351E"
shade6 = "#493A20"
shade7 = "#4E3E23"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
