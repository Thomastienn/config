[terminal]
ansi = [
  "#291D12", "#E67777", "#A3B973", "#E7C481",
  "#8CB1C3", "#A189AF", "#8CB1C3", "#FAF1DE",
  "#6D5A31", "#ED8B89", "#A8C56D", "#F2CB80",
  "#89BED7", "#B298C6", "#89BED7", "#FFF9F1",
]
bat = "Monokai Extended"
