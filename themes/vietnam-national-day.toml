# Vietnam National Day: Flag gold and red on dark ochre.
# Apply with: theme apply themes/vietnam-national-day.toml
name = "Vietnam National Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2E2A24"
text = "#EEE8DC"
muted = "#B1ADA2"
primary = "#D6C48C"
secondary = "#E2A69E"
warning = "#E0C08A"
error = "#DFA3A4"
border = "#554F42"
separator = "#6F6754"
selection = "#48392C"
urgent_background = "#3C2725"
pane_border = "#37322B"
gradient_start = "#332B20"
gradient_end = "#342822"
menu_text = "#FFFFFF"
panel_separator = "#686254"
shade1 = "#282420"
shade3 = "#342F29"
shade4 = "#3A342C"
shade5 = "#443B2F"
shade6 = "#484034"
shade7 = "#4D4539"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#DF7071", "#A2B872", "#E4C383",
  "#8BB0C2", "#9981A7", "#8BB0C2", "#EEE8DC",
  "#554F42", "#E78684", "#A8C56D", "#EFCA82",
  "#8ABFD8", "#AC92BF", "#8ABFD8", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
