# Father Day: Indigo and leather tan.
# Apply with: theme apply themes/father-day.toml
name = "Father Day Indigo"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#191B1D"
surface = "#272B30"
text = "#ECE8E1"
muted = "#A8AEB2"
primary = "#A1BFDD"
secondary = "#DBBD96"
warning = "#DDC28A"
error = "#DBA0AA"
border = "#46505B"
separator = "#5B6A79"
selection = "#323D4A"
urgent_background = "#352838"
pane_border = "#2D343A"
gradient_start = "#252D38"
gradient_end = "#242C35"
menu_text = "#FFFFFF"
panel_separator = "#59646F"
shade1 = "#212529"
shade3 = "#2B3137"
shade4 = "#2F353D"
shade5 = "#343E49"
shade6 = "#39434E"
shade7 = "#3E4853"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Blue"
