wm = "Mint-Y"

[terminal]
ansi = [
  "#191B1D", "#DA7282", "#9EBA70", "#DFC390",
  "#87B2C1", "#9082B6", "#87B2C1", "#ECE8E1",
  "#46505B", "#E28795", "#A5C76C", "#EACB90",
  "#86C1D6", "#A592CF", "#86C1D6", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
