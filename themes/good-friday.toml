# Good Friday: Quiet violet and stone.
# Apply with: theme apply themes/good-friday.toml
name = "Good Friday Reflection"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1C"
surface = "#2C292F"
text = "#EFE7E0"
muted = "#B4AAAF"
primary = "#C3AFD1"
secondary = "#C8C2BC"
warning = "#DCC38A"
error = "#DBA0AA"
border = "#524C59"
separator = "#6D6476"
selection = "#403947"
urgent_background = "#392732"
pane_border = "#353139"
gradient_start = "#2F2A35"
gradient_end = "#2E2933"
menu_text = "#FFFFFF"
panel_separator = "#665F6D"
shade1 = "#262428"
shade3 = "#322E36"
shade4 = "#37333B"
shade5 = "#403946"
shade6 = "#453E4B"
shade7 = "#4A4350"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Purple"
gtk3 = "Mint-Y-Dark-Purple"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1C", "#DD6F80", "#9CBA74", "#E4C28F",
  "#84B2C4", "#957FB6", "#84B2C4", "#EFE7E0",
  "#524C59", "#E68593", "#A2C770", "#EEC98E",
  "#83C1DA", "#A990CF", "#83C1DA", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
