# Good Friday: Quiet violet and stone.
# Apply with: theme apply themes/good-friday.toml
name = "Good Friday Reflection"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#211A29"
surface = "#332C3C"
text = "#F6EEE7"
muted = "#E8DDE2"
primary = "#C9B5D8"
secondary = "#C8C2BC"
warning = "#ECD093"
error = "#EDA2AF"
border = "#584D63"
separator = "#6E617A"
selection = "#3F3846"
urgent_background = "#422838"
pane_border = "#352D3E"
gradient_start = "#322A3A"
