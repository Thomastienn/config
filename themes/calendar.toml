# Discoverable examples only; keep these disabled.
# Put real dates in local/theme-calendar.toml (Git-ignored) and enable them there.
# Private events append to this registry; they do not replace entries by name.
[[events]]
name = "Birthday"
enabled = false
theme = "birthday.toml"
date = "13-01"  # Illustrative MM-DD, not a real personal date.
