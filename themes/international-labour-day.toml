# International Labour Day: Iron brown, brick, brass.
# Apply with: theme apply themes/international-labour-day.toml
name = "International Labour Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1A18"
surface = "#2F2925"
text = "#F1E7DD"
muted = "#B6ABA4"
primary = "#E6AD94"
secondary = "#DFC08A"
warning = "#DDC28A"
error = "#DEA2A6"
border = "#5A4C45"
separator = "#77635A"
selection = "#46392E"
urgent_background = "#3C2728"
pane_border = "#39312D"
gradient_start = "#362923"
gradient_end = "#322920"
menu_text = "#FFFFFF"
panel_separator = "#6E5F58"
shade1 = "#292321"
shade3 = "#362E2A"
shade4 = "#3C332E"
shade5 = "#483932"
shade6 = "#4C3E37"
shade7 = "#52433D"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Orange"
gtk3 = "Mint-Y-Dark-Orange"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1A18", "#E06E76", "#9EBA6D", "#E8C185",
  "#87B2BE", "#9B7FAD", "#87B2BE", "#F1E7DD",
  "#5A4C45", "#E9848A", "#A6C76A", "#F4C785",
  "#87C1D4", "#AE8FC6", "#87C1D4", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
