# International Labour Day: Iron brown, brick, brass.
# Apply with: theme apply themes/international-labour-day.toml
name = "International Labour Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#241C18"
surface = "#372D26"
text = "#F9EDE1"
muted = "#F5D9C7"
primary = "#EDA98B"
secondary = "#E5C388"
warning = "#EFD08D"
error = "#F0A1A8"
border = "#664B3E"
separator = "#805D4D"
selection = "#45392E"
urgent_background = "#44292B"
pane_border = "#3C2D26"
gradient_start = "#382A24"
