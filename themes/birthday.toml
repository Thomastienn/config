wm = "Mint-Y"

[terminal]
ansi = [
  "#222039", "#DE7687", "#A2BB7A", "#DFC391",
  "#8BB3CB", "#9988BF", "#8BB3CB", "#F4F0E9",
  "#525977", "#E58A99", "#A7C775", "#EAC990",
  "#89C1DF", "#AA96D6", "#89C1DF", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
