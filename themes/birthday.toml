# Birthday: Periwinkle and confetti pink.
# Apply with: theme apply themes/birthday.toml
name = "Birthday Confetti"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1A1A1D"
surface = "#2A2A30"
text = "#ECE8E1"
muted = "#A9AEB4"
primary = "#A6BCDF"
secondary = "#D1A6C3"
warning = "#E0BF8A"
error = "#DBA0AA"
border = "#4B4F5C"
separator = "#61687A"
selection = "#3D394B"
urgent_background = "#362836"
pane_border = "#31323A"
gradient_start = "#2B2B38"
gradient_end = "#2C2935"
menu_text = "#FFFFFF"
panel_separator = "#5E6270"
shade1 = "#242429"
shade3 = "#2F2F37"
shade4 = "#33343D"
shade5 = "#3A3B49"
shade6 = "#3F404E"
shade7 = "#444553"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Blue"
gtk3 = "Mint-Y-Dark-Blue"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1A1A1D", "#D97283", "#A0B978", "#DFC391",
  "#88B0C8", "#9281B7", "#88B0C8", "#ECE8E1",
  "#4B4F5C", "#E28796", "#A6C674", "#EBCA91",
  "#87BFDD", "#A591D1", "#87BFDD", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
