# International Women Day: Violet, lilac, gold.
# Apply with: theme apply themes/international-women-day.toml
name = "International Women Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1C"
surface = "#2C292F"
text = "#F0E7E2"
muted = "#B3AAB3"
primary = "#C1AFD5"
secondary = "#DDC28A"
warning = "#DCC38A"
error = "#DBA0AC"
border = "#524C59"
separator = "#6C6476"
selection = "#443746"
urgent_background = "#382733"
pane_border = "#343139"
gradient_start = "#2F2A36"
gradient_end = "#312831"
menu_text = "#FFFFFF"
panel_separator = "#66606D"
shade1 = "#262429"
shade3 = "#322E36"
shade4 = "#37333B"
shade5 = "#3F3A47"
shade6 = "#443F4C"
shade7 = "#494351"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
