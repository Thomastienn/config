wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1C", "#DE6E83", "#9FBA6C", "#E4C192",
  "#88B2BD", "#957FB8", "#88B2BD", "#F0E7E2",
  "#524C59", "#E68496", "#A5C768", "#EFC892",
  "#87C1D2", "#AA8FD1", "#87C1D2", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
