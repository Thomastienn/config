# Vietnam Family Day: Lacquer plum and warm amber.
# Apply with: theme apply themes/vietnam-family-day.toml
name = "Vietnam Family Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1B1A1C"
surface = "#2C292F"
text = "#EFE7E1"
muted = "#B4AAB1"
primary = "#C2AED4"
secondary = "#E3B88F"
warning = "#DEC28A"
error = "#DBA0AA"
border = "#534C59"
separator = "#6D6476"
selection = "#433743"
urgent_background = "#3A2731"
pane_border = "#353138"
gradient_start = "#302935"
gradient_end = "#32272F"
menu_text = "#FFFFFF"
panel_separator = "#665F6D"
shade1 = "#262328"
shade3 = "#322E35"
shade4 = "#37333B"
shade5 = "#413946"
shade6 = "#453E4B"
shade7 = "#4B4350"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Purple"
gtk3 = "Mint-Y-Dark-Purple"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1B1A1C", "#DD6F81", "#A0B970", "#E4C28F",
  "#89B2C1", "#957FB7", "#89B2C1", "#EFE7E1",
  "#534C59", "#E68594", "#A6C76B", "#EFC991",
  "#88C1D6", "#A98FD0", "#88C1D6", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
