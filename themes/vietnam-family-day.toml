# Vietnam Family Day: Rice-paddy green and lantern amber.
# Apply with: theme apply themes/vietnam-family-day.toml
name = "Vietnam Family Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1C1C1A"
surface = "#2F2D29"
text = "#EFECE1"
muted = "#B4B2AA"
primary = "#ADC77E"
secondary = "#E6B067"
warning = "#DEC28A"
error = "#DBA0AA"
border = "#59564C"
separator = "#767264"
selection = "#3B3F2C"
urgent_background = "#392929"
pane_border = "#383631"
gradient_start = "#2B3022"
gradient_end = "#332B20"
menu_text = "#FFFFFF"
panel_separator = "#6D6A5F"
shade1 = "#282723"
shade3 = "#35332E"
shade4 = "#3B3933"
shade5 = "#464339"
shade6 = "#4B483E"
shade7 = "#504D43"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark"
gtk3 = "Mint-Y-Dark"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1C1C1A", "#DD6F81", "#A0B970", "#E4C28F",
  "#89B2C1", "#957FB7", "#89B2C1", "#EFECE1",
  "#59564C", "#E68594", "#A6C76B", "#EFC991",
  "#88C1D6", "#A98FD0", "#88C1D6", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
