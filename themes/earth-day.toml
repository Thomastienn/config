# Earth Day: Forest green, leaf green, river blue.
# Apply with: theme apply themes/earth-day.toml
name = "Earth Day Canopy"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#14251F"
surface = "#253A30"
