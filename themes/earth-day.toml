muted = "#DAE6CE"
primary = "#9FCEA0"
secondary = "#8FCBDA"
warning = "#E6D096"
error = "#EAA4AA"
border = "#425D4A"
separator = "#54735A"
selection = "#2D463E"
urgent_background = "#383030"
pane_border = "#25392E"
gradient_start = "#22362C"
gradient_end = "#203632"
menu_text = "#F3F0E2"
panel_separator = "#54735A"
shade1 = "#1A2C24"
shade3 = "#1F3329"
shade4 = "#23372D"
shade5 = "#263B30"
