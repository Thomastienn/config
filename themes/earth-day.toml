[terminal]
ansi = [
  "#181B1A", "#D9747B", "#95BC78", "#DFC588",
  "#7DB3C8", "#9183B0", "#7DB3C8", "#ECE9DC",
  "#46534A", "#E2898D", "#9CC975", "#E9CC88",
  "#7CC2DD", "#A493C8", "#7CC2DD", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
