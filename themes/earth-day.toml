# Earth Day: Forest green, leaf green, river blue.
# Apply with: theme apply themes/earth-day.toml
name = "Earth Day Canopy"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1A"
surface = "#252C29"
text = "#ECE9DC"
muted = "#AAAFA5"
primary = "#AACCAA"
secondary = "#93C7D4"
warning = "#D9C48B"
error = "#DEA2A6"
border = "#46534A"
separator = "#5C6D5F"
selection = "#2B413A"
urgent_background = "#332B2B"
pane_border = "#2D3530"
gradient_start = "#223029"
gradient_end = "#202F2C"
menu_text = "#FFFFFF"
panel_separator = "#5A675C"
shade1 = "#212624"
shade3 = "#2A322E"
shade4 = "#2E3732"
shade5 = "#324138"
shade6 = "#37463D"
shade7 = "#3C4A42"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
