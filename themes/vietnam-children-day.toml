# Vietnam Children Day: Pool blue, sunshine yellow, aqua.
# Apply with: theme apply themes/vietnam-children-day.toml
name = "Vietnam Children Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#132632"
surface = "#253B48"
text = "#F2F1E8"
muted = "#D6EBE8"
primary = "#94DCE8"
secondary = "#F5D887"
warning = "#F0D28D"
error = "#E9A5B0"
border = "#3E626E"
separator = "#4E7A86"
selection = "#36484D"
urgent_background = "#38303E"
pane_border = "#223C48"
gradient_start = "#203844"
gradient_end = "#2A383A"
menu_text = "#F2F1E8"
panel_separator = "#4E7A86"
shade1 = "#182D39"
shade3 = "#1D3541"
shade4 = "#213945"
shade5 = "#243E4A"
shade6 = "#27424E"
shade7 = "#2A4753"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
