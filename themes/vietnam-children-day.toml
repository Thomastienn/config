gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#181B1C", "#D67582", "#9EBA6B", "#DBC58F",
  "#88B2BC", "#8E83B6", "#88B2BC", "#EAE9E0",
  "#425258", "#DF8A95", "#A4C767", "#E7CC8F",
  "#87C2D1", "#A193D0", "#87C2D1", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
