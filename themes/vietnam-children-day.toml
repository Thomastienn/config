[terminal]
ansi = [
  "#132632", "#DA7885", "#A3BF70", "#DBC58F",
  "#8CB7C1", "#958ABE", "#8CB7C1", "#F2F1E8",
  "#3E626E", "#E18C97", "#A8CB6B", "#E6CB8E",
  "#8AC5D4", "#A698D5", "#8AC5D4", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
