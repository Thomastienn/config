# Vietnam Children Day: Pool blue, sunshine yellow, aqua.
# Apply with: theme apply themes/vietnam-children-day.toml
name = "Vietnam Children Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1C"
surface = "#252B2F"
text = "#EAE9E0"
muted = "#A2B1AF"
primary = "#92C8D1"
secondary = "#D8C48B"
warning = "#DBC38A"
error = "#DBA0AA"
border = "#425258"
separator = "#556D73"
selection = "#2E3F44"
urgent_background = "#322A38"
pane_border = "#2C3439"
gradient_start = "#212F36"
gradient_end = "#202E30"
menu_text = "#FFFFFF"
panel_separator = "#55666B"
shade1 = "#212629"
shade3 = "#293136"
shade4 = "#2D363B"
shade5 = "#303F47"
shade6 = "#35444B"
shade7 = "#3A4950"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Aqua"
