wm = "Mint-Y"

[terminal]
ansi = [
  "#1D1A19", "#E06E77", "#9DBB6D", "#E8C086",
  "#86B3BE", "#9A7FAE", "#86B3BE", "#F0E7DC",
  "#5A4B46", "#E9838A", "#A3C769", "#F3C887",
  "#85C2D3", "#AE8FC7", "#85C2D3", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
