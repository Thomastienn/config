# US Thanksgiving: Russet and corn gold.
# Apply with: theme apply themes/us-thanksgiving.toml
name = "US Thanksgiving Harvest"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#2A1A16"
surface = "#402B24"
text = "#F8EDE0"
muted = "#F2D7C6"
primary = "#E3A389"
secondary = "#D8C986"
warning = "#EED08D"
error = "#EFA0A8"
border = "#67473C"
separator = "#7F594B"
selection = "#4C382C"
urgent_background = "#492829"
pane_border = "#402A24"
gradient_start = "#3D2822"
gradient_end = "#3B2C21"
menu_text = "#F8EDE0"
panel_separator = "#7F594B"
shade1 = "#311F1B"
shade3 = "#39251F"
shade4 = "#3D2822"
shade5 = "#422C25"
shade6 = "#472F28"
shade7 = "#4B332B"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Orange"
gtk3 = "Mint-Y-Dark-Orange"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#2A1A16", "#E4717A", "#A0BE70", "#E5BE84",
  "#89B6C1", "#9E83B2", "#89B6C1", "#F8EDE0",
  "#67473C", "#EB858C", "#A5C96B", "#EFC483",
  "#86C3D4", "#B091C9", "#86C3D4", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
