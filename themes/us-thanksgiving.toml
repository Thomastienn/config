# US Thanksgiving: Russet and corn gold.
# Apply with: theme apply themes/us-thanksgiving.toml
name = "US Thanksgiving Harvest"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1D1A19"
surface = "#302926"
text = "#F0E7DC"
muted = "#B6ABA4"
primary = "#E5AC95"
secondary = "#D2C68D"
warning = "#DCC38A"
error = "#DDA1A7"
border = "#5A4B46"
separator = "#78635B"
selection = "#49382D"
urgent_background = "#3C2727"
pane_border = "#3A302E"
gradient_start = "#372924"
gradient_end = "#332921"
menu_text = "#FFFFFF"
panel_separator = "#6F5F59"
shade1 = "#292322"
shade3 = "#362E2B"
shade4 = "#3C322F"
shade5 = "#483834"
shade6 = "#4D3D39"
shade7 = "#52433D"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Orange"
