# Vietnam War Invalids and Martyrs Day: Quiet earth, incense gold, muted red.
# Apply with: theme apply themes/vietnam-martyrs-day.toml
name = "Vietnam Martyrs Day"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#1D1A19"
surface = "#2F2926"
text = "#EFE8DC"
muted = "#B3ACA2"
primary = "#DEBD90"
secondary = "#E0A3A3"
warning = "#E0C08A"
error = "#DEA2A6"
border = "#574D42"
separator = "#736655"
selection = "#453935"
urgent_background = "#3C272A"
pane_border = "#39312C"
gradient_start = "#332B24"
gradient_end = "#332826"
menu_text = "#FFFFFF"
panel_separator = "#6B6155"
shade1 = "#292321"
shade3 = "#362E2A"
shade4 = "#3B332D"
shade5 = "#453A33"
shade6 = "#4A3F37"
shade7 = "#50443A"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark-Sand"
gtk3 = "Mint-Y-Dark-Sand"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#1D1A19", "#DF6F76", "#A1B973", "#E4C285",
  "#8AB1C4", "#9780AC", "#8AB1C4", "#EFE8DC",
  "#574D42", "#E8858A", "#A7C670", "#F0C985",
  "#89C0DA", "#AC91C5", "#89C0DA", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
