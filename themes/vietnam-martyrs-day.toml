gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#211B19", "#E3737A", "#A0B872", "#E3C184",
  "#89B0C3", "#9D86B2", "#89B0C3", "#F7EEE0",
  "#5D4E3E", "#EA878C", "#A5C36D", "#EEC783",
  "#86BDD7", "#AF94C9", "#86BDD7", "#FFF9F1",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
