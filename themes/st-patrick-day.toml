# St Patrick Day: Shamrock green and gold.
# Apply with: theme apply themes/st-patrick-day.toml
name = "St Patrick Day Shamrock"
mode = "dark"
wallpaper = "wallpapers/hoppers.png"

[colors]
background = "#181B1A"
surface = "#262C28"
text = "#EAE9DC"
muted = "#A8B0A6"
primary = "#A7CCAE"
secondary = "#DAC38B"
warning = "#DDC28A"
error = "#DEA1A7"
border = "#46534A"
separator = "#5B6D60"
selection = "#314133"
urgent_background = "#312C2B"
pane_border = "#2D3530"
gradient_start = "#223029"
gradient_end = "#242E26"
menu_text = "#FFFFFF"
panel_separator = "#59675D"
shade1 = "#212624"
shade3 = "#2A322E"
shade4 = "#2E3733"
shade5 = "#324139"
shade6 = "#37463D"
shade7 = "#3C4B42"

[fonts]
ui = "ComicShannsMono Nerd Font"
proportional = "ComicShannsMono Nerd Font Propo"
terminal = "ComicShannsMonoNerdFont"
terminal_size = 12.0
gtk2 = "Sans 10"
gtk3 = "ComicShannsMono Nerd Font 10"
lock = "Lato"
lock_clock = "Lato Light"

[desktop]
gtk2 = "Mint-Y-Dark"
gtk3 = "Mint-Y-Dark"
gtk2_icons = "Mint-Y-Blue"
icons = "Papirus-Dark"
cursor = "Bibata-Modern-Classic"
cursor_size = 0
wm = "Mint-Y"

[terminal]
ansi = [
  "#181B1A", "#D8757B", "#9EBA6C", "#DDC687",
  "#87B2BD", "#8F83AF", "#87B2BD", "#EAE9DC",
  "#46534A", "#E08A8D", "#A5C768", "#E9CC88",
  "#86C1D2", "#A394C9", "#86C1D2", "#F6F0E8",
]
bat = "Monokai Extended"
taskwarrior = "solarized-dark-256.theme"
