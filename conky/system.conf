conky.config = {
    -- Position & Size
    alignment = 'top_right',
    gap_x = 28,
    gap_y = 52,
    minimum_width = 240,
    maximum_width = 240,
    border_inner_margin = 12,
    border_outer_margin = 0,
    
    -- Window
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_colour = '191B19',
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Rendering
    background = false,
    double_buffer = true,
    use_xft = true,
    font = 'ComicShannsMono Nerd Font:size=9',
    xftalpha = 1,
    
    -- Text
    default_color = 'EEE8DC',
    uppercase = false,
    use_spacer = 'none',
    extra_newline = false,
    text_buffer_size = 8192,
    
    -- Performance
    update_interval = 5,
    cpu_avg_samples = 4,
    net_avg_samples = 4,
    no_buffers = true,
    
    -- Disable unused features
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    out_to_console = false,
    out_to_stderr = false,
    
    -- Theme colors
    color1 = '{{CONKY_COLOR1}}',  -- Mint headings
    color2 = '{{CONKY_COLOR2}}',  -- Cream values
    color3 = '{{CONKY_COLOR3}}',  -- Muted labels
    color4 = '{{CONKY_COLOR4}}',  -- Sage separators
}

conky.text = [[
${color1}${font ComicShannsMono Nerd Font:bold:size=42}${time %H:%M}${font}${color}
${voffset 4}${color2}${time %A, %d %B %Y}${color}
${voffset 20}${color1}${font ComicShannsMono Nerd Font:bold:size=11}System${font}${color}
${voffset 8}${color3}CPU${color}${alignr}${color2}${cpu}%${color}
${color1}${cpubar 2,240}${color}
${voffset 4}${color3}Memory${color}${alignr}${color2}${memperc}%${color}
${color #C0AFD5}${membar 2,240}${color}
${voffset 4}${color3}Storage${color}${alignr}${color2}${fs_used_perc /}%${color}
${color4}${fs_bar 2,240 /}${color}
${if_existing /sys/class/power_supply/BAT0}${voffset 4}${color3}Battery${color}${alignr}${color2}${battery_percent}%${color}
${color1}${battery_bar 2,240}${color}
${endif}${voffset 20}${color1}${font ComicShannsMono Nerd Font:bold:size=11}Network${font}${color}
${voffset 8}${if_up wlo1}${color2}${wireless_essid wlo1}${color}${alignr}${color3}${wireless_link_qual_perc wlo1}%${color}
${voffset 4}${color3}Download${color}${alignr}${color2}${downspeed wlo1}/s${color}
${color3}Upload${color}${alignr}${color2}${upspeed wlo1}/s${color}${else}${if_up enp55s0}${color2}Wired${color}${alignr}${color3}Connected${color}
${voffset 4}${color3}Download${color}${alignr}${color2}${downspeed enp55s0}/s${color}
${color3}Upload${color}${alignr}${color2}${upspeed enp55s0}/s${color}${else}${color3}Offline${color}${endif}${endif}
${voffset 20}${color1}${font ComicShannsMono Nerd Font:bold:size=11}Processes${font}${color}
${voffset 8}${color3}${top name 1}${color}${alignr}${color2}${top cpu 1}%${color}
${color3}${top name 2}${color}${alignr}${color2}${top cpu 2}%${color}
${color3}${top name 3}${color}${alignr}${color2}${top cpu 3}%${color}
${voffset 16}${color3}${font ComicShannsMono Nerd Font:size=8}Uptime${alignr}${uptime_short}${font}${color}
]]
