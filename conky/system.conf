conky.config = {
    -- Position & Size
    alignment = 'top_right',
    gap_x = 32,
    gap_y = 48,
    minimum_width = 250,
    maximum_width = 250,
    
    -- Window
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'override',
    own_window_transparent = false,
    own_window_colour = '191B19',
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    
    -- Rendering
    background = false,
    double_buffer = true,
    use_xft = true,
    font = 'ComicShannsMono Nerd Font:size=10',
    xftalpha = 1,
    
    -- Text
    default_color = 'EEE8DC',
    uppercase = false,
    use_spacer = 'none',
    extra_newline = false,
    text_buffer_size = 8192,
    
    -- Performance
    update_interval = 5,
    cpu_avg_samples = 4,
    net_avg_samples = 4,
    no_buffers = true,
    
    -- Disable unused features
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    out_to_console = false,
    out_to_stderr = false,
    
    -- Theme colors
    color1 = '{{CONKY_COLOR1}}',  -- Mint headings
    color2 = '{{CONKY_COLOR2}}',  -- Cream values
    color3 = '{{CONKY_COLOR3}}',  -- Muted labels
    color4 = '{{CONKY_COLOR4}}',  -- Sage separators
}

conky.text = [[
${color1}${font ComicShannsMono Nerd Font:bold:size=36}${time %H:%M}${font}${color}
${color3}${time %A, %d %B}${color}
${voffset 16}${color1}SYS${color}${color4} ${hr 1}${color}
${voffset 6}${color3}cpu${color}  ${color2}${cpu}%${color}
${color1}${cpubar 4,240}${color}
${voffset 4}${color3}mem${color}  ${color2}${memperc}%${color}
${color #C0AFD5}${membar 4,240}${color}
${voffset 4}${color3}dsk${color}  ${color2}${fs_used_perc /}%${color}
${color4}${fs_bar 4,240 /}${color}
${if_existing /sys/class/power_supply/BAT0}${voffset 4}${color3}bat${color}  ${color2}${battery_percent}%${color}
${color1}${battery_bar 4,240}${color}
${endif}${voffset 10}${color1}NET${color}${color4} ${hr 1}${color}
${voffset 6}${if_up wlo1}${color3}${wireless_essid wlo1}${color}${alignr}${color2}${wireless_link_qual_perc wlo1}%${color}
${color3}↓${color} ${color2}${downspeed wlo1}/s${color}${alignr}${color3}↑${color} ${color2}${upspeed wlo1}/s${color}${else}${if_up enp55s0}${color3}wired${color}${alignr}${color2}connected${color}
${color3}↓${color} ${color2}${downspeed enp55s0}/s${color}${alignr}${color3}↑${color} ${color2}${upspeed enp55s0}/s${color}${else}${color4}offline${color}${endif}${endif}
${voffset 10}${color1}TOP${color}${color4} ${hr 1}${color}
${voffset 6}${color3}${top name 1}${color}${alignr}${color2}${top cpu 1}%${color}
${color3}${top name 2}${color}${alignr}${color2}${top cpu 2}%${color}
${color3}${top name 3}${color}${alignr}${color2}${top cpu 3}%${color}
${voffset 10}${color1}TASKS${color}${color4} ${hr 1}${color}
${voffset 6}${font ComicShannsMono Nerd Font:size=9}${execp python3 /home/thomas/thomas_config/conky/task_list.py}${font}${color}
${voffset 12}${color3}${font ComicShannsMono Nerd Font:size=8}uptime ${uptime_short}${font}${color}
]]
