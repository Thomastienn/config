<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock In</title>
<link rel="stylesheet" href="gate.css">
<main>
  <p class="eyebrow">Focus Garden</p>
  <h1 id="heading">Back to your task.</h1>
  <p id="task"></p>
  <p id="status" role="status" aria-live="polite"></p>
  <p id="resource"></p>
  <div class="actions">
    <button id="back">Return to approved work</button>
    <button id="request">Request 5 minutes for this page</button>
  </div>
  <p class="muted">New access needs a task-related reason and a 10-second wait. Your original tabs stay open.</p>
  <button id="end" class="escape">Emergency end — no waiting</button>
</main>
<script src="gate.js" type="module"></script>
</html>
